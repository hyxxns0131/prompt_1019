<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 패턴 도우미</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #677085;
    --line: #e2e5ec;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --ok: #1f9d55;
    --code-bg: #f1f3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b;
      --panel: #1a1e26;
      --text: #e6e9ef;
      --muted: #98a1b3;
      --line: #2b313d;
      --accent: #6b9bff;
      --accent-soft: #1f2a42;
      --ok: #4ccb84;
      --code-bg: #141821;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b;
    --panel: #1a1e26;
    --text: #e6e9ef;
    --muted: #98a1b3;
    --line: #2b313d;
    --accent: #6b9bff;
    --accent-soft: #1f2a42;
    --ok: #4ccb84;
    --code-bg: #141821;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .theme-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 60px);
  }
  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 14px;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  .search {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  .cat { margin: 14px 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
  }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  main { padding: 20px; min-width: 0; }
  .title-row h2 { margin: 0 0 4px; font-size: 22px; }
  .desc { color: var(--muted); margin: 0 0 18px; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-bottom: 6px;
  }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    min-width: 0;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 40px;
  }
  .field textarea:focus, .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .no-fields { color: var(--muted); font-size: 14px; }

  pre.preview {
    margin: 0;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, "D2Coding", Consolas, monospace;
    font-size: 13.5px;
    max-height: 60vh;
    overflow-y: auto;
  }
  pre.preview mark {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 2px;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.done { background: var(--ok); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; align-self: center; }

  .menu-btn { display: none; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside {
      position: static;
      max-height: none;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      display: none;
    }
    aside.open { display: block; }
    .menu-btn { display: inline-block; }
    .grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header { padding: 12px 16px; }
    header p { display: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>프롬프트 패턴 도우미</h1>
    <p>패턴을 고르고 빈칸만 채우면 프롬프트가 완성됩니다</p>
  </div>
  <div>
    <button class="theme-btn menu-btn" id="menuBtn" aria-label="패턴 목록 열기">☰ 목록</button>
    <button class="theme-btn" id="themeBtn" aria-label="테마 바꾸기">🌓</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <input class="search" id="search" type="search" placeholder="패턴 검색 (예: 퓨샷, APE)">
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="title-row">
      <span class="tag" id="tplCat"></span>
      <h2 id="tplTitle"></h2>
    </div>
    <p class="desc" id="tplDesc"></p>

    <div class="grid">
      <section class="card">
        <h3>빈칸 채우기</h3>
        <div id="fields"></div>
        <div class="actions">
          <button class="btn ghost" id="resetBtn">예시값으로 되돌리기</button>
          <button class="btn ghost" id="clearBtn">모두 비우기</button>
        </div>
      </section>

      <section class="card">
        <h3>완성된 프롬프트</h3>
        <pre class="preview" id="preview"></pre>
        <div class="actions">
          <button class="btn primary" id="copyBtn">복사하기</button>
          <span class="count" id="count"></span>
        </div>
      </section>
    </div>
  </main>
</div>

// {이름} 은 입력칸, {{이름}} 은 AI에게 그대로 보여 줄 형식 표시(입력칸 아님)
const FIELD_RE = /\{\{([^{}]+)\}\}|\{([^{}\n]+)\}/g;

const $ = (id) => document.getElementById(id);
const nav = $("nav"), fieldsEl = $("fields"), previewEl = $("preview");
let current = 0;
let values = {};

// 템플릿에서 입력칸 이름을 순서대로 뽑기
function fieldNames(tpl) {
  const names = [];
  for (const m of tpl.matchAll(FIELD_RE)) {
    if (m[2] && !names.includes(m[2])) names.push(m[2]);
  }
  return names;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// 완성된 프롬프트(복사용 텍스트)
function buildText() {
  const t = TEMPLATES[current];
  return t.tpl.replace(FIELD_RE, (_, lit, name) =>
    lit !== undefined ? "{" + lit + "}" : (values[name] || "{" + name + "}"));
}

// 미리보기(입력값은 강조 표시)
function renderPreview() {
  const t = TEMPLATES[current];
  let html = "", last = 0;
  for (const m of t.tpl.matchAll(FIELD_RE)) {
    html += escapeHtml(t.tpl.slice(last, m.index));
    if (m[1] !== undefined) {
      html += escapeHtml("{" + m[1] + "}");
    } else {
      const v = values[m[2]];
      html += v ? "<mark>" + escapeHtml(v) + "</mark>" : "<mark>{" + escapeHtml(m[2]) + "}</mark>";
    }
    last = m.index + m[0].length;
  }
  html += escapeHtml(t.tpl.slice(last));
  previewEl.innerHTML = html;
  $("count").textContent = buildText().length + "자";
}

function renderFields() {
  const t = TEMPLATES[current];
  const names = fieldNames(t.tpl);
  fieldsEl.innerHTML = "";
  if (!names.length) {
    fieldsEl.innerHTML = '<p class="no-fields">이 패턴은 채울 빈칸이 없습니다. 그대로 복사해 쓰세요.</p>';
    return;
  }
  names.forEach((name) => {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = name;
    const ta = document.createElement("textarea");
    ta.value = values[name] || "";
    ta.placeholder = t.vals[name] || name;
    ta.rows = Math.min(8, Math.max(1, (ta.value.match(/\n/g) || []).length + 1));
    ta.addEventListener("input", () => {
      values[name] = ta.value;
      renderPreview();
    });
    wrap.append(label, ta);
    fieldsEl.appendChild(wrap);
  });
}

function select(i) {
  current = i;
  const t = TEMPLATES[i];
  values = { ...t.vals };
  $("tplCat").textContent = t.cat;
  $("tplTitle").textContent = t.title;
  $("tplDesc").textContent = t.desc;
  document.querySelectorAll(".item").forEach((el) =>
    el.classList.toggle("active", Number(el.dataset.i) === i));
  renderFields();
  renderPreview();
  $("sidebar").classList.remove("open");
  try { localStorage.setItem("prompt-helper-last", String(i)); } catch (e) {}
}

function renderNav(filter = "") {
  const q = filter.trim().toLowerCase();
  nav.innerHTML = "";
  let lastCat = null;
  TEMPLATES.forEach((t, i) => {
    const hay = (t.cat + " " + t.title + " " + t.desc).toLowerCase();
    if (q && !hay.includes(q)) return;
    if (t.cat !== lastCat) {
      const c = document.createElement("div");
      c.className = "cat";
      c.textContent = t.cat;
      nav.appendChild(c);
      lastCat = t.cat;
    }
    const b = document.createElement("button");
    b.className = "item" + (i === current ? " active" : "");
    b.dataset.i = i;
    b.textContent = t.title;
    b.addEventListener("click", () => select(i));
    nav.appendChild(b);
  });
  if (!nav.children.length) nav.innerHTML = '<p class="no-fields">검색 결과가 없습니다.</p>';
}

// 복사 (clipboard API가 막힌 환경 대비)
async function copyText() {
  const text = buildText();
  const btn = $("copyBtn");
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  btn.textContent = "복사됨 ✓";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = "복사하기"; btn.classList.remove("done"); }, 1500);
}

$("copyBtn").addEventListener("click", copyText);
$("resetBtn").addEventListener("click", () => select(current));
$("clearBtn").addEventListener("click", () => {
  values = {};
  renderFields();
  renderPreview();
});
$("search").addEventListener("input", (e) => renderNav(e.target.value));
$("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("open"));
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const isDark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("prompt-helper-theme", root.dataset.theme); } catch (e) {}
});

// 시작
try {
  const th = localStorage.getItem("prompt-helper-theme");
  if (th) document.documentElement.dataset.theme = th;
} catch (e) {}
let start = 0;
try {
  const saved = Number(localStorage.getItem("prompt-helper-last"));
  if (saved >= 0 && saved < TEMPLATES.length) start = saved;
} catch (e) {}
current = start;
renderNav();
select(start);
</script>
